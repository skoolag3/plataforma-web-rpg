<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111; font-size: 20px; }
    .titulo { font-size: 28px; font-weight: 700; }
    .sistema { fill: #fff; stroke: #222; stroke-width: 2; }
    .nome-sistema { font-size: 20px; font-weight: 700; }
    .ator circle, .ator line { fill: #fff; stroke: #111; stroke-width: 3; }
    .ator text { font-weight: 600; }
    .caso-uso ellipse { fill: #f5f5f5; stroke: #222; stroke-width: 2; }
    .caso-uso text { font-size: 18px; }
    .associacao { stroke: #333; stroke-width: 2; }
    .dependencia { stroke: #333; stroke-width: 2; stroke-dasharray: 9 7; }
    .rotulo { font-size: 16px; fill: #333; paint-order: stroke; stroke: #fff; stroke-width: 7px; stroke-linejoin: round; }
    .nota { font-size: 16px; fill: #555; font-style: italic; }
  </style>
  <rect width="1400" height="900" fill="#fff" />
  <text class="titulo" x="700" y="52" text-anchor="middle">Casos de uso — Arena e progressão</text>
  <rect class="sistema" x="300" y="92" width="800" height="735" />
  <text class="nome-sistema" x="320" y="124">AnimeCards</text>
  <line class="associacao" x1="180" y1="435" x2="370" y2="185" />
  <line class="associacao" x1="180" y1="435" x2="370" y2="370" />
  <line class="associacao" x1="180" y1="435" x2="370" y2="570" />
  <line class="associacao" x1="180" y1="435" x2="740" y2="570" />
  
  <line class="dependencia" x1="630" y1="185" x2="740" y2="185" marker-end="url(#seta)" />
  <text class="rotulo" x="685" y="177" text-anchor="middle">«include»</text>
  
  <line class="dependencia" x1="630" y1="370" x2="740" y2="370" marker-end="url(#seta)" />
  <text class="rotulo" x="685" y="362" text-anchor="middle">«extend»</text>
  
  <g class="ator">
    <circle cx="150" cy="375" r="18" />
    <line x1="150" y1="393" x2="150" y2="449" />
    <line x1="120" y1="415" x2="180" y2="415" />
    <line x1="150" y1="449" x2="122" y2="487" />
    <line x1="150" y1="449" x2="178" y2="487" />
    <text x="150" y="517" text-anchor="middle">Jogador</text>
  </g>
  
  <g id="iniciar" class="caso-uso">
    <ellipse cx="500" cy="185" rx="130" ry="43" />
    <text x="500" y="185" text-anchor="middle">Iniciar batalha</text>
  </g>
  
  <g id="alvo" class="caso-uso">
    <ellipse cx="870" cy="185" rx="130" ry="43" />
    <text x="870" y="185" text-anchor="middle">Selecionar alvo</text>
  </g>
  
  <g id="resultado" class="caso-uso">
    <ellipse cx="500" cy="370" rx="130" ry="43" />
    <text x="500" y="370" text-anchor="middle">Consultar resultado</text>
  </g>
  
  <g id="rubys" class="caso-uso">
    <ellipse cx="870" cy="370" rx="130" ry="43" />
    <text x="870" y="370" text-anchor="middle">Receber Rubys</text>
  </g>
  
  <g id="historico" class="caso-uso">
    <ellipse cx="500" cy="570" rx="130" ry="43" />
    <text x="500" y="570" text-anchor="middle">Consultar histórico</text>
  </g>
  
  <g id="ranking" class="caso-uso">
    <ellipse cx="870" cy="570" rx="130" ry="43" />
    <text x="870" y="570" text-anchor="middle">Consultar ranking</text>
  </g>
  
</svg>