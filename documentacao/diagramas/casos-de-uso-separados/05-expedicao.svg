<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111; font-size: 20px; }
    .titulo { font-size: 28px; font-weight: 700; }
    .sistema { fill: #fff; stroke: #222; stroke-width: 2; }
    .nome-sistema { font-size: 20px; font-weight: 700; }
    .ator circle, .ator line { fill: #fff; stroke: #111; stroke-width: 3; }
    .ator text { font-weight: 600; }
    .caso-uso ellipse { fill: #f5f5f5; stroke: #222; stroke-width: 2; }
    .caso-uso text { font-size: 18px; }
    .associacao { stroke: #333; stroke-width: 2; }
    .dependencia { stroke: #333; stroke-width: 2; stroke-dasharray: 9 7; }
    .rotulo { font-size: 16px; fill: #333; paint-order: stroke; stroke: #fff; stroke-width: 7px; stroke-linejoin: round; }
    .nota { font-size: 16px; fill: #555; font-style: italic; }
  </style>
  <rect width="1400" height="900" fill="#fff" />
  <text class="titulo" x="700" y="52" text-anchor="middle">Casos de uso — Expedição</text>
  <rect class="sistema" x="300" y="92" width="800" height="735" />
  <text class="nome-sistema" x="320" y="124">AnimeCards</text>
  <line class="associacao" x1="180" y1="435" x2="370" y2="175" />
  <line class="associacao" x1="180" y1="435" x2="370" y2="340" />
  <line class="associacao" x1="180" y1="435" x2="740" y2="340" />
  <line class="associacao" x1="180" y1="435" x2="370" y2="530" />
  <line class="associacao" x1="1210" y1="435" x2="1020" y2="530" />
  
  <line class="dependencia" x1="630" y1="175" x2="740" y2="175" marker-end="url(#seta)" />
  <text class="rotulo" x="685" y="167" text-anchor="middle">«include»</text>
  
  <line class="dependencia" x1="500" y1="383" x2="655" y2="675" marker-end="url(#seta)" />
  <text class="rotulo" x="577.5" y="521" text-anchor="middle">«include»</text>
  
  <line class="dependencia" x1="630" y1="530" x2="720" y2="530" marker-end="url(#seta)" />
  <text class="rotulo" x="675" y="522" text-anchor="middle">«include»</text>
  
  <line class="dependencia" x1="870" y1="573" x2="715" y2="675" marker-end="url(#seta)" />
  <text class="rotulo" x="792.5" y="616" text-anchor="middle">«include»</text>
  
  <g class="ator">
    <circle cx="150" cy="375" r="18" />
    <line x1="150" y1="393" x2="150" y2="449" />
    <line x1="120" y1="415" x2="180" y2="415" />
    <line x1="150" y1="449" x2="122" y2="487" />
    <line x1="150" y1="449" x2="178" y2="487" />
    <text x="150" y="517" text-anchor="middle">Jogador</text>
  </g>
  
  <g class="ator">
    <circle cx="1240" cy="375" r="18" />
    <line x1="1240" y1="393" x2="1240" y2="449" />
    <line x1="1210" y1="415" x2="1270" y2="415" />
    <line x1="1240" y1="449" x2="1212" y2="487" />
    <line x1="1240" y1="449" x2="1268" y2="487" />
    <text x="1240" y="517" text-anchor="middle">Serviço de IA</text>
  </g>
  
  <g id="iniciar" class="caso-uso">
    <ellipse cx="500" cy="175" rx="130" ry="43" />
    <text x="500" y="175" text-anchor="middle">Iniciar expedição</text>
  </g>
  
  <g id="caminho" class="caso-uso">
    <ellipse cx="870" cy="175" rx="130" ry="43" />
    <text x="870" y="175" text-anchor="middle">Escolher caminho</text>
  </g>
  
  <g id="batalha" class="caso-uso">
    <ellipse cx="500" cy="340" rx="130" ry="43" />
    <text x="500" y="340" text-anchor="middle">Realizar batalha</text>
  </g>
  
  <g id="checkpoint" class="caso-uso">
    <ellipse cx="870" cy="340" rx="130" ry="43" />
    <text x="870" y="340" text-anchor="middle">Resgatar checkpoint</text>
  </g>
  
  <g id="chefe" class="caso-uso">
    <ellipse cx="500" cy="530" rx="130" ry="43" />
    <text x="500" y="530" text-anchor="middle">Enfrentar chefe</text>
  </g>
  
  <g id="eventoIa" class="caso-uso">
    <ellipse cx="870" cy="530" rx="150" ry="43" />
    <text x="870" y="518" text-anchor="middle">Processar evento</text>
    <text x="870" y="542" text-anchor="middle">imersivo do chefe</text>
  </g>
  
  <g id="recompensa" class="caso-uso">
    <ellipse cx="685" cy="700" rx="155" ry="43" />
    <text x="685" y="688" text-anchor="middle">Calcular recompensa</text>
    <text x="685" y="712" text-anchor="middle">ou penalidade</text>
  </g>
  <text class="nota" x="700" y="865" text-anchor="middle">O evento de IA do chefe permanece em desenvolvimento.</text>
</svg>