<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111; font-size: 20px; }
    .titulo { font-size: 28px; font-weight: 700; }
    .sistema { fill: #fff; stroke: #222; stroke-width: 2; }
    .nome-sistema { font-size: 20px; font-weight: 700; }
    .ator circle, .ator line { fill: #fff; stroke: #111; stroke-width: 3; }
    .ator text { font-weight: 600; }
    .caso-uso ellipse { fill: #f5f5f5; stroke: #222; stroke-width: 2; }
    .caso-uso text { font-size: 18px; }
    .associacao { stroke: #333; stroke-width: 2; }
    .dependencia { stroke: #333; stroke-width: 2; stroke-dasharray: 9 7; }
    .rotulo { font-size: 16px; fill: #333; paint-order: stroke; stroke: #fff; stroke-width: 7px; stroke-linejoin: round; }
    .nota { font-size: 16px; fill: #555; font-style: italic; }
  </style>
  <rect width="1400" height="900" fill="#fff" />
  <text class="titulo" x="700" y="52" text-anchor="middle">Casos de uso — Coleção e decks</text>
  <rect class="sistema" x="300" y="92" width="800" height="735" />
  <text class="nome-sistema" x="320" y="124">AnimeCards</text>
  <line class="associacao" x1="180" y1="435" x2="370" y2="190" />
  <line class="associacao" x1="180" y1="435" x2="370" y2="360" />
  <line class="associacao" x1="180" y1="435" x2="740" y2="360" />
  <line class="associacao" x1="180" y1="435" x2="370" y2="550" />
  
  <line class="dependencia" x1="630" y1="190" x2="740" y2="190" marker-end="url(#seta)" />
  <text class="rotulo" x="685" y="182" text-anchor="middle">«include»</text>
  
  <line class="dependencia" x1="630" y1="550" x2="740" y2="550" marker-end="url(#seta)" />
  <text class="rotulo" x="685" y="542" text-anchor="middle">«include»</text>
  
  <g class="ator">
    <circle cx="150" cy="375" r="18" />
    <line x1="150" y1="393" x2="150" y2="449" />
    <line x1="120" y1="415" x2="180" y2="415" />
    <line x1="150" y1="449" x2="122" y2="487" />
    <line x1="150" y1="449" x2="178" y2="487" />
    <text x="150" y="517" text-anchor="middle">Jogador</text>
  </g>
  
  <g id="colecao" class="caso-uso">
    <ellipse cx="500" cy="190" rx="130" ry="43" />
    <text x="500" y="190" text-anchor="middle">Consultar coleção</text>
  </g>
  
  <g id="filtro" class="caso-uso">
    <ellipse cx="870" cy="190" rx="130" ry="43" />
    <text x="870" y="178" text-anchor="middle">Filtrar e ordenar</text>
    <text x="870" y="202" text-anchor="middle">cartas</text>
  </g>
  
  <g id="favorito" class="caso-uso">
    <ellipse cx="500" cy="360" rx="130" ry="43" />
    <text x="500" y="360" text-anchor="middle">Favoritar carta</text>
  </g>
  
  <g id="vender" class="caso-uso">
    <ellipse cx="870" cy="360" rx="130" ry="43" />
    <text x="870" y="360" text-anchor="middle">Vender carta</text>
  </g>
  
  <g id="deck" class="caso-uso">
    <ellipse cx="500" cy="550" rx="130" ry="43" />
    <text x="500" y="550" text-anchor="middle">Criar ou editar deck</text>
  </g>
  
  <g id="equipar" class="caso-uso">
    <ellipse cx="870" cy="550" rx="130" ry="43" />
    <text x="870" y="538" text-anchor="middle">Validar e equipar</text>
    <text x="870" y="562" text-anchor="middle">deck</text>
  </g>
  
</svg>