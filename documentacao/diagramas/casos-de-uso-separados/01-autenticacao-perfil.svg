<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #111; font-size: 20px; }
    .titulo { font-size: 28px; font-weight: 700; }
    .sistema { fill: #fff; stroke: #222; stroke-width: 2; }
    .nome-sistema { font-size: 20px; font-weight: 700; }
    .ator circle, .ator line { fill: #fff; stroke: #111; stroke-width: 3; }
    .ator text { font-weight: 600; }
    .caso-uso ellipse { fill: #f5f5f5; stroke: #222; stroke-width: 2; }
    .caso-uso text { font-size: 18px; }
    .associacao { stroke: #333; stroke-width: 2; }
    .dependencia { stroke: #333; stroke-width: 2; stroke-dasharray: 9 7; }
    .rotulo { font-size: 16px; fill: #333; paint-order: stroke; stroke: #fff; stroke-width: 7px; stroke-linejoin: round; }
    .nota { font-size: 16px; fill: #555; font-style: italic; }
  </style>
  <rect width="1400" height="900" fill="#fff" />
  <text class="titulo" x="700" y="52" text-anchor="middle">Casos de uso — Autenticação e perfil</text>
  <rect class="sistema" x="300" y="92" width="800" height="735" />
  <text class="nome-sistema" x="320" y="124">AnimeCards</text>
  <line class="associacao" x1="180" y1="435" x2="370" y2="210" />
  <line class="associacao" x1="180" y1="435" x2="740" y2="210" />
  <line class="associacao" x1="180" y1="435" x2="370" y2="390" />
  <line class="associacao" x1="180" y1="435" x2="740" y2="390" />
  <line class="associacao" x1="180" y1="435" x2="535" y2="610" />
  
  <line class="dependencia" x1="870" y1="433" x2="760" y2="585" marker-end="url(#seta)" />
  <text class="rotulo" x="815" y="501" text-anchor="middle">«extend»</text>
  
  <g class="ator">
    <circle cx="150" cy="375" r="18" />
    <line x1="150" y1="393" x2="150" y2="449" />
    <line x1="120" y1="415" x2="180" y2="415" />
    <line x1="150" y1="449" x2="122" y2="487" />
    <line x1="150" y1="449" x2="178" y2="487" />
    <text x="150" y="517" text-anchor="middle">Jogador</text>
  </g>
  
  <g id="cadastrar" class="caso-uso">
    <ellipse cx="500" cy="210" rx="130" ry="43" />
    <text x="500" y="210" text-anchor="middle">Cadastrar-se</text>
  </g>
  
  <g id="entrar" class="caso-uso">
    <ellipse cx="870" cy="210" rx="130" ry="43" />
    <text x="870" y="210" text-anchor="middle">Autenticar-se</text>
  </g>
  
  <g id="perfil" class="caso-uso">
    <ellipse cx="500" cy="390" rx="130" ry="43" />
    <text x="500" y="390" text-anchor="middle">Editar perfil</text>
  </g>
  
  <g id="caixa" class="caso-uso">
    <ellipse cx="870" cy="390" rx="130" ry="43" />
    <text x="870" y="378" text-anchor="middle">Consultar caixa</text>
    <text x="870" y="402" text-anchor="middle">de entrada</text>
  </g>
  
  <g id="recompensa" class="caso-uso">
    <ellipse cx="685" cy="610" rx="150" ry="43" />
    <text x="685" y="598" text-anchor="middle">Resgatar recompensa</text>
    <text x="685" y="622" text-anchor="middle">diária ou semanal</text>
  </g>
  
</svg>